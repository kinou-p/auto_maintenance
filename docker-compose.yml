services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auto_maintenance_backend
    restart: unless-stopped
    ports:
      - "8800:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
      # Chemin hôte = chemin container pour DDEV (Docker-in-Docker)
      - ${HOST_DDEV_PROJECTS:-./data/ddev-projects}:${DDEV_PROJECTS_DIR:-/app/data/ddev-projects}
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-auto_maintenance_super_secret_jwt_key_2026_change_me!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5180,http://localhost:5173}
      - DDEV_ALLOW_ROOT=true
      - DDEV_PROJECTS_DIR=${DDEV_PROJECTS_DIR:-/app/data/ddev-projects}
      - HOST_DDEV_PROJECTS=${HOST_DDEV_PROJECTS:-}
      - MAX_CONCURRENT_WORKFLOWS=${MAX_CONCURRENT_WORKFLOWS:-2}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-2048}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auto_maintenance_frontend
    restart: unless-stopped
    ports:
      - "5180:80"
    depends_on:
      backend:
        condition: service_healthy
