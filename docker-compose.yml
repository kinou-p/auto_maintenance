services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auto_maintenance_backend
    restart: always
    ports:
      - "8800:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DDEV_PROJECTS:-/tmp/ddev-projects}:${HOST_DDEV_PROJECTS:-/tmp/ddev-projects}
    environment:
      - PYTHONUNBUFFERED=1
      - DDEV_ALLOW_ROOT=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auto_maintenance_frontend
    restart: always
    ports:
      - "5180:80"
    depends_on:
      - backend
